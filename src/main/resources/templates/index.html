<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Electric Shop</title>
    <style>
        /* Internal CSS */
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f4; }
        .product-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        img { max-width: 100%; height: auto; border-radius: 5px; }
        button { background-color: #007bff; color: white; border: none; padding: 10px; cursor: pointer; }
    </style>
</head>
<body>

<h1>எங்கள் மின்சாதனக் கடை</h1>

<div class="product-grid">
    <div class="card" th:each="product : ${products}">
        <img th:src="${product.imageUrl}" alt="Product Image">
        <h3 th:text="${product.name}">பொருள் பெயர்</h3>
        <p>விலை: ₹<span th:text="${product.price}">0</span></p>
        <button onclick="addToCart()">வாங்கு</button>
    </div>
</div>

<script>
    /* Internal JS */
    function addToCart() {
        alert("பொருள் கார்ட்டில் சேர்க்கப்பட்டது!");
    }
</script>
</body>
</html>
