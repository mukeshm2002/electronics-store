<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Product | Admin</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #6e8efb, #a777e3);
            --text-color: #2d3436;
            --bg-color: #f0f2f5;
        }

        body { font-family: 'Poppins', sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; }

        .navbar { background: #ffffff; padding: 1.5rem 5%; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; }

        .container {
            max-width: 600px;
            margin: 50px auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            border: 1px solid rgba(255,255,255,0.3);
        }

        h2 { text-align: center; margin-bottom: 30px; font-weight: 600; }

        input, textarea {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #eee;
            border-radius: 15px;
            box-sizing: border-box;
            font-family: inherit;
            transition: 0.3s;
        }

        input:focus, textarea:focus { border-color: #a777e3; outline: none; box-shadow: 0 0 10px rgba(167, 119, 227, 0.2); }

        .btn {
            background: var(--primary-gradient);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 50px;
            width: 100%;
            cursor: pointer;
            font-weight: 600;
            margin-top: 20px;
            transition: 0.3s;
        }
        .btn:hover { transform: scale(1.02); opacity: 0.9; }

        label { display: block; margin-top: 15px; color: #636e72; font-size: 0.9rem; }
    </style>
</head>
<body>

<nav class="navbar">
    <h1>Admin Panel</h1>
</nav>

<div class="container">
    <h2>Add New Product</h2>
    <form th:action="@{/admin/products/save}" method="post" enctype="multipart/form-data">
        <input type="text" name="name" placeholder="Product Name" required>
        <textarea name="description" placeholder="Description"></textarea>
        <input type="number" name="price" placeholder="Price" step="0.01" required>
        <input type="number" name="stockQuantity" placeholder="Stock Quantity">

        <label style="font-weight: bold;">Upload Product Image:</label>
        <input type="file" name="file" accept="image/*" required>

        <button type="submit" class="btn">Save Product</button>
    </form>
</div>

</body>
</html>
