<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Product - Admin</title>
    <style>
        body { font-family: sans-serif; padding: 40px; background-color: #f9f9f9; }
        .form-container { background: white; padding: 20px; border-radius: 8px; max-width: 500px; margin: auto; }
        input, textarea, select { width: 100%; margin-bottom: 15px; padding: 10px; }
        button { background-color: #28a745; color: white; border: none; padding: 12px; width: 100%; cursor: pointer; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>புதிய பொருளைச் சேர்க்கவும்</h2>
    <form th:action="@{/admin/products/save}" method="post" enctype="multipart/form-data">
        <input type="text" name="name" placeholder="பொருள் பெயர்" required>
        <textarea name="description" placeholder="விளக்கம்"></textarea>
        <input type="number" name="price" placeholder="விலை" step="0.01" required>
        <input type="number" name="stockQuantity" placeholder="இருப்பு அளவு">

        <label>படம் அப்லோட் செய்யவும்:</label>
        <input type="file" name="file" accept="image/*" required>

        <button type="submit">பொருளைச் சேமி</button>
    </form>
</div>

<script>
    console.log("Admin product upload form ready.");
</script>

</body>
</html>
