<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Products | Electric Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #6e8efb, #a777e3);
            --danger-gradient: linear-gradient(135deg, #ff7675, #d63031);
            --bg-color: #f8f9fa;
        }

        body { font-family: 'Poppins', sans-serif; background: var(--bg-color); margin: 0; color: #2d3436; }

        /* Navbar */
        .navbar { background: #ffffff; padding: 1.2rem 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .nav-links a { margin-left: 20px; text-decoration: none; color: #636e72; font-weight: 600; }

        .container { padding: 50px 5%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }

        /* Card Styling */
        .card {
            background: #ffffff; border-radius: 20px; padding: 20px; transition: 0.4s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            display: flex; flex-direction: column; align-items: center; text-align: center;
        }
        .card:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(110, 142, 251, 0.2); }

        /* Image Styling */
        .card img {
            width: 100%; height: 200px;
            object-fit: contain; /* படம் முழுமையாகத் தெரியும் */
            background-color: #f8f9fa;
            border-radius: 15px; margin-bottom: 15px; padding: 10px;
        }

        /* Buttons */
        .btn {
            background: var(--primary-gradient); color: white; padding: 10px 25px;
            border-radius: 50px; text-decoration: none; display: block;
            font-weight: 600; border: none; cursor: pointer; width: 80%; margin-bottom: 10px;
        }
        .btn-delete { background: var(--danger-gradient); }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

<nav class="navbar">
    <h2>Electronics Store</h2>
    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/cart">Cart</a>
    </div>
</nav>

<div class="container">
    <h2>Available Products</h2>
    <div class="grid">
        <div class="card" th:each="p : ${products}">
            <img th:src="${p.imageUrl}" alt="Product Image">
            <h3 th:text="${p.name}">Product Name</h3>

            <a th:href="@{/product/{id}(id=${p.id})}" class="btn">View Details</a>

            <form th:action="@{/admin/products/delete/{id}(id=${p.id})}" method="post"
                  onsubmit="return confirm('Are you sure you want to delete this product?');" style="width: 100%;">
                <button type="submit" class="btn btn-delete">Delete Product</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
