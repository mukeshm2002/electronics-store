<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Products | Electric Shop</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #e67e22;
            --bg-color: #f4f7f6;
            --white: #ffffff;
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); margin: 0; color: #333; }

        .navbar { background: var(--primary-color); padding: 1.5rem; text-align: center; color: var(--white); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .navbar a { color: var(--white); text-decoration: none; margin: 0 15px; font-weight: bold; }

        .container { max-width: 1000px; margin: 30px auto; padding: 25px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; }
        .card { background: var(--white); border: 1px solid #ddd; padding: 20px; border-radius: 8px; text-align: center; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 5px; margin-bottom: 15px; }

        .btn { background: var(--secondary-color); color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; display: inline-block; font-weight: bold; margin-top: 10px; }
        .btn:hover { background: #d35400; }
    </style>
</head>
<body>

<nav class="navbar">
    <h1>Electronics Store</h1>
    <a href="/">Home</a> | <a href="/cart">Cart</a>
</nav>

<div class="container">
    <h2>Available Products</h2>
    <div class="grid">
        <div class="card" th:each="p : ${products}">
            <img th:src="${p.imageUrl}" alt="Product Image">
            <h3 th:text="${p.name}">Product Name</h3>
            <a th:href="@{/product/{id}(id=${p.id})}" class="btn">View Details</a>
        </div>
    </div>
</div>

</body>
</html>
