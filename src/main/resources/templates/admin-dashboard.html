<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard | Electric Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #6e8efb, #a777e3);
            --text-color: #2d3436;
        }
        body { font-family: 'Poppins', sans-serif; background: #f0f2f5; margin: 0; color: var(--text-color); }

        .navbar { background: #ffffff; padding: 1.5rem 5%; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .container { padding: 40px 5%; }

        /* Dashboard Sections */
        .dashboard-section { background: white; border-radius: 20px; padding: 30px; margin-bottom: 40px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; padding: 15px; border-bottom: 2px solid #f0f2f5; color: #636e72; }
        td { padding: 15px; border-bottom: 1px solid #f0f2f5; }

        .btn { background: var(--primary-gradient); color: white; padding: 10px 20px; border-radius: 50px; text-decoration: none; font-weight: 600; display: inline-block; }
        .status-badge { padding: 5px 12px; border-radius: 20px; font-size: 0.85rem; background: #e1f5fe; color: #0288d1; }
    </style>
</head>
<body>

<nav class="navbar">
    <h1>Admin Dashboard</h1>
</nav>

<div class="container">
    <section class="dashboard-section">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>Recent Orders</h2>
        </div>
        <table>
            <thead>
            <tr><th>Order ID</th><th>Customer</th><th>Total</th><th>Status</th></tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td th:text="${order.id}">#101</td>
                <td th:text="${order.customer != null ? order.customer.fullName : 'Guest'}">Name</td>
                <td th:text="'₹' + ${order.totalAmount}">₹0</td>
                <td><span class="status-badge" th:text="${order.status}">Pending</span></td>
            </tr>
            </tbody>
        </table>
    </section>

    <section class="dashboard-section">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>Inventory Stock</h2>
            <a href="/admin/products/add" class="btn">+ Add New Product</a>
        </div>
        <table>
            <thead>
            <tr><th>Product</th><th>Price</th><th>Stock</th><th>Action</th></tr>
            </thead>
            <tbody>
            <tr th:each="p : ${products}">
                <td th:text="${p.name}">Product Name</td>
                <td th:text="'₹' + ${p.price}">₹0</td>
                <td th:text="${p.stockQuantity}">0</td>
                <td>
                    <form th:action="@{/admin/products/delete/{id}(id=${p.id})}" method="post">
                        <button type="submit" style="color: #ff7675; border: none; background: none; cursor: pointer;">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</div>

</body>
</html>
