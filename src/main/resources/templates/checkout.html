<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Checkout | Electric Shop</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.1);
            --primary-gradient: linear-gradient(135deg, #6e8efb, #a777e3);
            --text-color: #2d3436;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #f0f2f5;
            margin: 0;
            color: var(--text-color);
        }

        /* Modern Navbar */
        .navbar {
            background: #ffffff;
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* Creative Grid */
        .container { padding: 40px 5%; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        /* Product Cards - Glassmorphism Effect */
        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 20px;
            transition: 0.4s ease;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(110, 142, 251, 0.2);
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 15px;
        }

        /* Creative Buttons */
        .btn {
            background: var(--primary-gradient);
            color: white;
            padding: 12px 25px;
            border-radius: 50px;
            text-decoration: none;
            display: inline-block;
            font-weight: 600;
            transition: 0.3s;
        }
        .btn:hover { opacity: 0.9; transform: scale(1.05); }

        .btn-delete { background: #ff7675; }
    </style>
</head>
<body>

<nav class="navbar">
    <h1>Checkout</h1>
</nav>

<div class="container">
    <h2>Confirm Your Order</h2>
    <form th:action="@{/orders/submit}" method="post">
        <input type="text" name="customerName" placeholder="Full Name" required>
        <input type="email" name="customerEmail" placeholder="Email Address" required>
        <input type="text" name="address" placeholder="Delivery Address" required>

        <div class="total-section">
            <p>Total Amount: <strong>₹<span th:text="${totalAmount}">0</span></strong></p>
        </div>

        <button type="submit" class="btn">Place Order</button>
    </form>
</div>

</body>
</html>
