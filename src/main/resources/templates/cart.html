<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Your Cart</title>
    <style>
        .cart-table { width: 100%; border-collapse: collapse; }
        .cart-table td, th { border: 1px solid #ddd; padding: 8px; text-align: left; }
    </style>
</head>
<body>

<h2>உங்கள் கூடை (Cart)</h2>
<table class="cart-table">
    <tr>
        <th>பொருள் பெயர்</th>
        <th>விலை</th>
    </tr>
    <tr th:each="item : ${cartItems}">
        <td th:text="${item.name}">பெயர்</td>
        <td th:text="${item.price}">விலை</td>
    </tr>
</table>
<br>
<a href="/orders/checkout"><button>Checkout செய்ய</button></a>

</body>
</html>
